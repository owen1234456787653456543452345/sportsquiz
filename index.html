padding: 25px; } } </style> </head> <body> <!-- SPORT SCREEN --> <div id="sportScreen" class="screen active"> <div class="box"> <h1>🏆 Sports Quiz</h1> <p>Pick a sport to start!</p> <div class="sports"> <button class="sport-btn" onclick="selectSport('basketball')"> 🏀 Basketball </button> <button class="sport-btn" onclick="selectSport('football')"> 🏈 Football </button> <button class="sport-btn" onclick="selectSport('soccer')"> ⚽ Soccer </button> <button class="sport-btn" onclick="selectSport('baseball')"> ⚾ Baseball </button> <button class="sport-btn" onclick="selectSport('hockey')"> 🏒 Hockey </button> <button class="sport-btn" onclick="selectSport('tennis')"> 🎾 Tennis </button> </div> </div> </div> <!-- DIFFICULTY SCREEN --> <div id="difficultyScreen" class="screen"> <div class="box"> <h1>🎯 Difficulty</h1> <p id="chosenSport"></p> <div class="difficulties"> <button class="easy" onclick="startQuiz('easy')"> 🟢 Easy </button> <button class="medium" onclick="startQuiz('medium')"> 🟡 Medium </button> <button class="hard" onclick="startQuiz('hard')"> 🔴 Hard </button> </div> <button class="back-btn" onclick="goHome()"> ← Pick Another Sport </button> </div> </div> <!-- QUIZ SCREEN --> <div id="quizScreen" class="screen"> <div class="box"> <h2 id="sportTitle">Quiz</h2> <div id="difficultyText"></div> <div id="questionNumber"></div> <div id="question"></div> <div id="answers"></div> <button id="nextButton" class="next-btn" onclick="nextQuestion()" style="display:none;"> Next Question ➡️ </button> <br> <button class="back-btn" onclick="goHome()"> ← Start Over </button> </div> </div> <!-- SCORE SCREEN --> <div id="scoreScreen" class="screen"> <div class="box"> <h1>🎉 Quiz Complete!</h1> <p id="finalMessage"></p> <div id="score"></div> <button class="restart-btn" onclick="goHome()"> 🔄 Play Again </button> </div> </div> <script> const quizzes = { basketball: { easy: [ { question: "How many players from one team are on the court at once?", answers: ["4", "5", "6", "7"], correct: 1 }, ave on the field?", answers: ["7", "9", "11", "15"], correct: 2 }, { question: "What body part can the goalkeeper normally use that field players cannot?", answers: ["Head", "Hands", "Feet", "Chest"], correct: 1 }, { question: "How long is a regulation soccer match?", answers: ["60 minutes", "75 minutes", "90 minutes", "120 minutes"], correct: 2 }, { question: "What is it called when the ball goes completely over the goal line for a score?", answers: ["Touchdown", "Goal", "Try", "Home run"], correct: 1 }, { question: "Which card means a player is sent off?", answers: ["Blue", "Green", "Yellow", "Red"], correct: 3 } ], medium: [ { question: "How long is each half of a regulation soccer match?", answers: ["30 minutes", "40 minutes", "45 minutes", "50 minutes"], correct: 2 }, { question: "What is awarded when a defender commits a foul inside their own penalty area?", answers: ["Corner kick", "Penalty kick", "Throw-in", "Goal kick"], correct: 1 }, { question: "What is a hat-trick?", answers: [ "Three goals by one player", "Three assists", "Three yellow cards", "Three saves" ], correct: 0 }, { question: "What is a corner kick?", answers: [ "A kick taken from the corner area", "A free kick from midfield", "A penalty", "A goal kick" ], correct: 0 }, { question: "What is offside related to?", answers: [ "Player position when a teammate plays the ball", "Goalkeeper height", "Corner kicks", "Penalty kicks" ], correct: 0 } ], hard: [ { question: "How far is the penalty spot from the goal line?", answers: ["8 yards", "10 yards", "12 yards", "15 yards"], correct: 2 }, { question: "How many players are on the field for both teams combined at the start of a normal match?", answers: ["20", "21", "22", "24"], correct: 2 }, { question: "What is a clean sheet?", answers: [ "A game with no fouls", "A game where a team concedes no goals", "A game with no substitutions", "A game with no corners" ], correct: 1 }, { question: "What is a through ball?", answers: [ "A pass played into space ts" ], correct: 1 }, { question: "What is a balk?", answers: [ "An illegal motion by the pitcher", "A type of home run", "A catcher error", "A foul ball" ], correct: 0 }, { question: "What is a 5-4-3 double play?", answers: [ "Pitcher-catcher-first base", "Third base-second base-first base", "Shortstop-third base-second base", "First base-second base-third base" ], correct: 1 }, { question: "What is a walk-off win?", answers: [ "A win that ends the game immediately", "A win only by a home run", "A win after extra innings only", "A shutout" ], correct: 0 } ] }, hockey: { easy: [ { question: "How many players from one team are normally on the ice, including the goalie?", answers: ["5", "6", "7", "8"], correct: 1 }, { question: "What do hockey players use to hit the puck?", answers: ["Bat", "Stick", "Racket", "Club"], correct: 1 }, { question: "What is the playing surface called?", answers: ["Field", "Court", "Ice rink", "Diamond"], correct: 2 }, { question: "What object are players trying to shoot into the goal?", answers: ["Ball", "Puck", "Disc", "Ring"], correct: 1 }, { question: "How many periods are in a normal hockey game?", answers: ["2", "3", "4", "5"], correct: 1 } ], medium: [ { question: "How long is a standard NHL game, not including overtime?", answers: ["45 minutes", "60 minutes", "75 minutes", "90 minutes"], correct: 1 }, { question: "What is icing?", answers: [ "Sending the puck across certain lines without another player touching it", "A type of penalty shot", "A goal", "A faceoff" ], correct: 0 }, { question: "What is a power play?", answers: [ "Playing with an extra skater because the opponent has a penalty", "A type of overtime", "A faceoff", "A breakaway" ], correct: 0 }, { question: "What is a hat trick?", answers: [ "Three goals by one player", "Three saves", "Three assists", "Three penalties" ], correct: 0 }, { question: "What is a faceoff?", answers: [ "A way to restart play", "A penalty", "A goal", "A type of shot" ], correct: 0 } ], hard: [ { question: "How many players are normally on the ice for one team during a power play?", answers: ["4", "5", "6", "7"], correct: 1 }, { question: "What is a shorthanded goal?", answers: [ "A goal scored while a team is killing a penalty", "A goal from center ice", "A goal scored by the goalie", "An overtime goal" ], correct: 0 }, { question: "What is a Gordie Howe hat trick?", answers: [ "A goal, an assist and a fight", "Three goals in one period", "Three assists", "Three penalty shots" ], correct: 0 }, { question: "What is a breakaway?", answers: [ "A player getting a clear chance against the goalie", "A faceoff", "A penalty", "A line change" ], correct: 0 }, { question: "What is a slap shot?", answers: [ "A powerful shot using a large swing of the stick", "A shot with no backswing", "A pass", "A type of penalty" ], correct: 0 } ] }, tennis: { easy: [ { question: "What is a score of zero called in tennis?", answers: ["Love", "Nil", "Zero", "Blank"], correct: 0 }, { question: "What piece of equipment is used to hit the ball?", answers: ["Bat", "Stick", "Racket", "Club"], correct: 2 }, { question: "What separates the two sides of the court?", answers: ["Wall", "Net", "Fence", "Line"], correct: 1 }, { question: "What is the score after 40-40 called?", answers: ["Tie", "Deuce", "Draw", "Equal"], correct: 1 }, { question: "What is a serve that the opponent completely misses called?", answers: ["Ace", "Goal", "Strike", "Home run"], correct: 0 } ], medium: [ { question: "How many points are needed to win a standard game without deuce?", answers: ["3", "4", "5", "6"], correct: 1 }, { question: "What comes after 15 in the normal tennis scoring system?", answers: ["20", "25", "30", "35"], correct: 2 }, { question: "How many sets are usually needed to win a men's Grand Slam singles match?", answers: ["2", "3", "4", "5"], correct: 1 }, { question: "What is a break of serve?", answers: [ "Winning a game while receiving serve", "Serving twice", "Changing courts", "Winning a tiebreak" ], correct: 0 }, { question: "What is a volley?", answers: [ "Hitting the ball before it bounces", "Serving overhand", "Hitting the ball twice", "Letting the ball bounce twice" ], correct: 0 } ], hard: [ { question: "What is a tiebreak normally played to in a standard set?", answers: ["5 points", "7 points", "10 points", "15 points"], correct: 1 }, { question: "What does 'love-40' mean?", answers: [ "Server has 40, receiver has 0", "Server has 0, receiver has 40", "Both players have 40", "The score is tied" ], correct: 1 }, { question: "What is a let on a serve?", answers: [ "The serve touches the net and still lands correctly", "The serve lands out", "The receiver misses", "The server double faults" ], correct: 0 }, { question: "What is a double fault?", answers: [ "Two serves landing in", "Failing both attempts at a serve", "Two aces", "Two volleys" ], correct: 1 }, { question: "What is an unforced error?", answers: [ "A mistake made without significant pressure from the opponent", "A foot fault", "A double fault", "A successful return" ], correct: 0 } ] } }; let currentSport = ""; let currentDifficulty = ""; let currentQuestion = 0; let playerScore = 0; let answered = false; function showScreen(screenId) { document.querySelectorAll(".screen").forEach(screen => { screen.classList.remove("active"); }); document.getElementById(screenId).classList.add("active"); } function selectSport(sport) { currentSport = sport; let name = sport.charAt(0).toUpperCase() + sport.slice(1); document.getElementById("chosenSport").textContent = name + " selected! Now choose your difficulty."; showScreen("difficultyScreen"); } function startQuiz(difficulty) { currentDifficulty = difficulty; currentQuestion = 0; playerScore = 0; let sportName = currentSport.charAt(0).toUpperCase() + currentSport.slice(1); let difficultyName = difficulty.charAt(0).toUpperCase() + difficulty.slice(1); document.getElementById("sportTitle").textContent = sportName + " Quiz"; document.getElementById("difficultyText").textContent = "Difficulty: " + difficultyName; showScreen("quizScreen"); loadQuestion(); } function loadQuestion() { answered = false; const quiz = quizzes[currentSport][currentDifficulty]; const q = quiz[currentQuestion]; document.getElementById("questionNumber").textContent = "Question " + (currentQuestion + 1) + " of " + quiz.length; document.getElementById("question").textContent = q.question; const answersDiv = document.getElementById("answers"); answersDiv.innerHTML = ""; q.answers.forEach((answer, index) => { const button = document.createElement("button"); button.textContent = answer; button.className = "answer-btn"; button.onclick = function() { chooseAnswer(index, button); }; answersDiv.appendChild(button); }); document.getElementById("nextButton").style.display = "none"; } function chooseAnswer(index, clickedButton) { if (answered) return; answered = true; const quiz = quizzes[currentSport][currentDifficulty]; const q = quiz[currentQuestion]; const buttons = document.querySelectorAll(".answer-btn"); buttons.forEach(button => { button.disabled = true; }); if (index === q.correct) { playerScore++; clickedButton.classList.add("correct"); } else { clickedButton.classList.add("wrong"); buttons[q.correct].classList.add("correct"); } document.getElementById("nextButton").style.display = "inline-block"; } function nextQuestion() { currentQuestion++; const quiz = quizzes[currentSport][currentDifficulty]; if (currentQuestion >= quiz.length) { showScore(); } else { loadQuestion(); } } function showScore() { const quiz = quizzes[currentSport][currentDifficulty]; document.getElementById("score").textContent = playerScore + " / " + quiz.length; let message = ""; if (playerScore === quiz.length) { message = "🔥 PERFECT SCORE! You're a sports genius!"; } else if (playerScore >= 4) { message = "🏆 Amazing job! You really know your stuff!"; } else if (playerScore >= 2) { message = "👍 Nice job! Keep practicing!"; } else { message = "💪 Good try! Give it another s
